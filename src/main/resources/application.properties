server.address=127.0.0.1
spring.datasource.url=${WEBHOOK_DB_URL:jdbc:postgresql://127.0.0.1:5432/webhook}
spring.datasource.username=${WEBHOOK_DB_USER:webhook}
spring.datasource.password=${WEBHOOK_DB_PASSWORD:webhook-local-only}
spring.mvc.problemdetails.enabled=true
webhook.receiver-url=${WEBHOOK_RECEIVER_URL:http://127.0.0.1:8081/webhooks}
webhook.retry-delay-ms=${WEBHOOK_RETRY_DELAY_MS:5000}
