services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: webhook
      POSTGRES_USER: webhook
      POSTGRES_PASSWORD: webhook-local-only
    ports:
      - "127.0.0.1:${WEBHOOK_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webhook -d webhook"]
      interval: 2s
      timeout: 3s
      retries: 15
